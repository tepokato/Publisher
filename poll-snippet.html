<!--
========================================================================
SONDEO ANXiNA — bloque reutilizable (resultados reales agregados)
========================================================================
Cómo usarlo en un post nuevo:

1. Copia TODO este bloque (desde <div data-anxina-poll...> hasta </script>)
   al final del post, justo ANTES del párrafo de fuentes / cierre.

2. Cambia el identificador del sondeo en data-anxina-poll="..."
   -> Debe ser ÚNICO por post (ej. "gta6-fecha-2026"). Si repites un id,
      compartirá los votos con el otro post.

3. Mantén data-ns="anxina.xyz" (es el namespace del contador, no lo cambies).

4. Edita la pregunta (<strong>...) y las opciones (texto de cada <button>).
   Cada <button> necesita un data-key corto y único DENTRO del sondeo
   (ej. "si", "no", "espera"). No uses acentos ni espacios en data-key.

5. Agrega o quita <button> según necesites (mínimo 2). Al último botón
   déjale margin:0 en vez de margin:0 0 10px 0 para que cierre limpio.

Notas Blogger:
- Pega en la vista HTML y NO cambies a "Redacción/Compose" después
  (Blogger reescribe el HTML y puede romper el <script>).
- Si tu blog tiene activado "Convertir saltos de línea" (Configuración >
  Publicaciones), el <script> de una sola línea sobrevive sin problema:
  por eso va minificado a una línea. No lo desformatees.
- El conteo lo lleva Abacus (https://jasoncameron.dev/abacus/): gratis,
  sin registro, con CORS. Cada lector solo puede votar una vez por
  dispositivo (se guarda en localStorage); los totales sí son globales.
========================================================================
-->

<!-- ===== SONDEO ANXiNA (resultados reales vía Abacus) ===== -->
<div data-anxina-poll="CAMBIA-ESTE-ID" data-ns="anxina.xyz" style="border-left:4px solid #6eb5ff;background:rgba(255,255,255,0.08);padding:16px 20px;margin:24px 0;border-radius:0 6px 6px 0;color:inherit;">
<p style="margin:0 0 12px 0;color:inherit;"><strong>Pregunta del sondeo aquí</strong></p>
<button data-key="opcion1" style="display:block;text-align:left;width:100%;margin:0 0 10px 0;padding:10px 14px;border:1px solid rgba(110,181,255,0.4);background:rgba(255,255,255,0.04);color:inherit;border-radius:6px;font:inherit;cursor:pointer;">Texto de la opción 1</button>
<button data-key="opcion2" style="display:block;text-align:left;width:100%;margin:0 0 10px 0;padding:10px 14px;border:1px solid rgba(110,181,255,0.4);background:rgba(255,255,255,0.04);color:inherit;border-radius:6px;font:inherit;cursor:pointer;">Texto de la opción 2</button>
<button data-key="opcion3" style="display:block;text-align:left;width:100%;margin:0;padding:10px 14px;border:1px solid rgba(110,181,255,0.4);background:rgba(255,255,255,0.04);color:inherit;border-radius:6px;font:inherit;cursor:pointer;">Texto de la opción 3</button>
<p data-status style="margin:12px 0 0 0;font-size:0.85em;opacity:0.7;color:inherit;">Elige una opción para votar y ver los resultados.</p>
</div>
<script>
(function(){var BASE="https://abacus.jasoncameron.dev";function pct(n,t){return t>0?Math.round(n*100/t):0;}function init(root){if(root.getAttribute("data-init")==="1")return;root.setAttribute("data-init","1");var ns=root.getAttribute("data-ns")||"anxina.xyz";var poll=root.getAttribute("data-anxina-poll");var buttons=[].slice.call(root.querySelectorAll("[data-key]"));var status=root.querySelector("[data-status]");var votedKey=null;try{votedKey=localStorage.getItem("anxina-vote-"+poll);}catch(e){}function counter(k){return encodeURIComponent(poll+"__"+k);}function getAll(){return Promise.all(buttons.map(function(b){var k=b.getAttribute("data-key");return fetch(BASE+"/get/"+ns+"/"+counter(k)).then(function(r){return r.ok?r.json():{value:0};}).then(function(d){return {key:k,value:(d&&d.value)||0};}).catch(function(){return {key:k,value:0};});}));}function render(results){var total=results.reduce(function(s,r){return s+r.value;},0);buttons.forEach(function(b){var k=b.getAttribute("data-key");var r=results.filter(function(x){return x.key===k;})[0]||{value:0};var p=pct(r.value,total);var label=b.getAttribute("data-label")||b.textContent;b.disabled=true;b.style.cursor="default";b.style.position="relative";b.style.overflow="hidden";var mark=(k===votedKey)?" \u2014 tu voto":"";b.innerHTML='<span style="position:absolute;top:0;left:0;height:100%;width:'+p+'%;background:rgba(110,181,255,0.25);"></span><span style="position:relative;display:flex;justify-content:space-between;gap:10px;"><span>'+label+mark+'</span><span><strong>'+p+'%</strong></span></span>';});if(status){status.textContent="Total de votos: "+total;}}function vote(key){if(votedKey)return;votedKey=key;try{localStorage.setItem("anxina-vote-"+poll,key);}catch(e){}if(status){status.textContent="Registrando tu voto\u2026";}fetch(BASE+"/hit/"+ns+"/"+counter(key)).catch(function(){}).then(getAll).then(render);}buttons.forEach(function(b){var k=b.getAttribute("data-key");b.setAttribute("data-label",b.textContent);b.addEventListener("click",function(){vote(k);});});if(votedKey){getAll().then(render);}}var polls=document.querySelectorAll("[data-anxina-poll]");for(var i=0;i<polls.length;i++){init(polls[i]);}})();
</script>
<!-- ===== FIN SONDEO ANXiNA ===== -->
